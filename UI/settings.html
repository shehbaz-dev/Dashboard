<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THOR — SETTINGS</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#cc0000;--red-bright:#ff1a1a;--red-dim:#7a0000;--red-glow:rgba(204,0,0,0.35);--bg:#050505;--border:rgba(200,30,30,0.3);--text:#e8e8e8;--text-dim:#777;--text-muted:#555;--green-ok:#00ff88;--font-mono:'Share Tech Mono',monospace;--font-display:'Orbitron',sans-serif;--font-body:'Rajdhani',sans-serif;--radius:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);}
#page{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,rgba(80,0,0,0.06),transparent 70%);}
.header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(5,0,0,0.95);border-bottom:1px solid var(--border);flex-shrink:0;backdrop-filter:blur(10px);}
.header-icon{font-size:20px;color:var(--red-bright);filter:drop-shadow(0 0 8px var(--red-glow));}
.header-text{font-family:var(--font-display);font-size:15px;letter-spacing:4px;color:var(--red-bright);}
.header-sub{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);letter-spacing:2px;margin-left:auto;}
.content{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:16px;}
.gear-container{position:relative;width:100px;height:100px;}
.gear{position:absolute;font-size:70px;color:var(--red-dim);animation:spin 8s linear infinite;filter:drop-shadow(0 0 15px var(--red-glow));}
.gear-2{font-size:40px;right:-10px;bottom:-5px;animation:spin-reverse 6s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes spin-reverse{from{transform:rotate(360deg);}to{transform:rotate(0deg);}}
.module-title{font-family:var(--font-display);font-size:24px;letter-spacing:6px;color:var(--red-bright);text-shadow:0 0 20px var(--red-glow);}
.module-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:3px;}
.module-status{font-family:var(--font-mono);font-size:9px;color:var(--red-dim);letter-spacing:2px;padding:6px 16px;border:1px solid rgba(200,0,0,0.2);border-radius:20px;background:rgba(200,0,0,0.05);}
.progress-line{width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--red-dim),transparent);animation:scan 2.5s ease-in-out infinite;}
@keyframes scan{0%,100%{opacity:0.3;width:100px;}50%{opacity:1;width:280px;}}
.blink::after{content:'_';animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:300px;width:100%;}
.preview-item{background:rgba(200,0,0,0.04);border:1px solid rgba(200,0,0,0.12);border-radius:8px;padding:10px 12px;text-align:center;}
.preview-item .val{font-family:var(--font-mono);font-size:14px;color:var(--red-bright);}
.preview-item .lbl{font-family:var(--font-mono);font-size:8px;color:var(--text-muted);letter-spacing:1px;margin-top:2px;}
@media(max-width:500px){.module-title{font-size:18px;}.gear{font-size:50px;}.gear-2{font-size:30px;}.preview-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="scanlines"></div>
<div id="page">
  <div class="header">
    <span class="header-icon">⚙</span>
    <span class="header-text">SYSTEM_SETTINGS</span>
    <span class="header-sub">CONFIG v0.1</span>
  </div>
  <div class="content">
    <div class="gear-container">
      <div class="gear">⚙</div>
      <div class="gear gear-2">⚙</div>
    </div>
    <div class="module-title blink">SETTINGS</div>
    <div class="module-sub">// Configuration interface</div>
    <div class="progress-line"></div>
    <div class="module-status">⟳ BACKEND INTEGRATION IN PROGRESS</div>
    <div class="preview-grid">
      <div class="preview-item"><div class="val">−</div><div class="lbl">LISTENER</div></div>
      <div class="preview-item"><div class="val">−</div><div class="lbl">TELEMETRY</div></div>
      <div class="preview-item"><div class="val">−</div><div class="lbl">NOTIFICATIONS</div></div>
      <div class="preview-item"><div class="val">−</div><div class="lbl">SECURITY</div></div>
    </div>
  </div>
</div>
</body>
</html>
